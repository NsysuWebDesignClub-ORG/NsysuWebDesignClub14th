<script>
  // 處理子選單點擊事件
  function handleSubmenuClick(event, url) {
    // 檢查是否在手機版本
    if (window.innerWidth <= 991) {
      // 手機版本：切換子選單顯示
      event.preventDefault();
      const submenu = event.target.nextElementSibling;
      const isVisible = submenu.style.display === 'block';

      // 隱藏所有其他子選單
      document.querySelectorAll('.dropdown-submenu .dropdown-menu').forEach(menu => {
        menu.style.display = 'none';
      });

      // 切換當前子選單
      submenu.style.display = isVisible ? 'none' : 'block';
    } else {
      // 桌面版本：直接跳轉到連結
      window.open(url, '_blank');
    }
  }

  // 處理視窗大小改變
  window.addEventListener('resize', function () {
    if (window.innerWidth > 991) {
      // 桌面版本時隱藏所有手機版的子選單
      document.querySelectorAll('.dropdown-submenu .dropdown-menu').forEach(menu => {
        menu.style.display = '';
      });
    }
  });

  // 點擊外部時關閉所有下拉選單
  document.addEventListener('click', function (event) {
    if (!event.target.closest('.dropdown')) {
      document.querySelectorAll('.dropdown-submenu .dropdown-menu').forEach(menu => {
        menu.style.display = 'none';
      });
    }
  });
</script>
<script>
  function getPageNameWithoutExtension() {
    const path = window.location.pathname;
    const filename = path.substring(path.lastIndexOf('/') + 1);
    return filename.replace('.html', '');
  }
  function hideNavItems(navNumbers) {
    navNumbers.forEach(num => {
      const navItem = document.querySelector(`a[data-scroll-nav="${num}"]`);
      if (navItem) {
        navItem.parentElement.style.display = 'none'; // 隱藏整個 li
        // 或者只隱藏連結本身
        // navItem.style.display = 'none';
      }
    });
  }
  web = getPageNameWithoutExtension();
  console.log("Current page:", web);
  if (web == "history" || web == "class" || web == "class2" || web.includes("hak")) {
    // 隱藏所有導航項目
    hideNavItems([0, 1, 2, 3, 4, 5]);
    console.log(web);
  }
</script>

<style>
  .navbar {
    padding-top: 30px;
  }

  /* 載入動畫 */
  #navbar-container.loading {
    height: 60px;
    display: flex;
    justify-content: center;

  }

  .loading-spinner {

    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }

  /* 下拉選單基本樣式 - 平衡間距 */
  .dropdown-menu {
    padding: 6px 0;
    /* 適中的上下內距 */
  }

  .dropdown-item {
    padding: 8px 16px;
    /* 回到適中的間距 */
    font-size: 14px;
    line-height: 1.4;
    /* 稍微增加行高 */
  }

  /* 多層下拉選單樣式 - 子選單向左展開 */
  .dropdown-submenu {
    position: relative;
  }

  .dropdown-submenu .dropdown-menu {
    top: 0;
    right: 100%;
    /* 子選單出現在左邊 */
    left: auto;
    margin-top: -1px;
    border-radius: 6px 0 6px 6px;
    min-width: 200px;
    padding: 6px 0;
    /* 子選單也使用適中間距 */
    display: none;
    /* 預設隱藏 */
  }

  /* 桌面版本：hover 顯示子選單 */
  @media (min-width: 992px) {
    .dropdown-submenu:hover .dropdown-menu {
      display: block !important;
    }
  }

  /* 修正箭頭位置 - 垂直置中 */
  .dropdown-submenu>.dropdown-item {
    position: relative;
    padding-right: 30px;
    /* 為箭頭留出空間 */
    cursor: pointer;
  }

  .dropdown-submenu>.dropdown-item::after {
    content: "";
    position: absolute;
    top: 50%;
    /* 垂直置中 */
    right: 12px;
    /* 距離右邊的距離 */
    transform: translateY(-50%);
    /* 確保完全垂直置中 */
    width: 0;
    height: 0;
    border-color: transparent;
    border-style: solid;
    border-width: 4px 4px 4px 0;
    /* 稍微縮小箭頭 */
    border-right-color: #6c757d;
  }

  .dropdown-submenu:hover>.dropdown-item::after {
    border-right-color: #495057;
  }

  /* 響應式設計 - 手機版本 */
  @media (max-width: 991px) {
    .dropdown-submenu .dropdown-menu {
      position: static;
      float: none;
      width: auto;
      margin-top: 0;
      background-color: #f8f9fa;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      padding-left: 20px;
      right: auto;
      display: none;
      /* 手機版預設隱藏 */
    }

    .dropdown-submenu>.dropdown-item::after {
      border-width: 4px 0 4px 4px;
      /* 手機版箭頭向下 */
      border-left-color: #6c757d;
      border-right-color: transparent;
    }

    .dropdown-submenu .dropdown-item {
      font-size: 12px;
      padding: 8px 15px;
      /* 手機版也使用適中間距 */
    }

    .dropdown-submenu>.dropdown-item {
      padding-right: 30px;
      /* 手機版也需要箭頭空間 */
    }
  }

  /* navbar container 改善空間擠壓 */
  .navbar>.container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    transition: all 0.3s ease;
  }

  .navbar .nav-item a:hover {

  }

  /* RWD: 991px 以下變成 dropdown 垂直 */

  /* 動畫效果 */

</style>
